name: ebook
run-name: eBook ${{ inputs.lang }}

on:
  workflow_dispatch:
    inputs:
      lang:
        description: hindi / english / urdu
        required: true
      publish:
        description: publish (true/false)
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EB_LANG: ${{ inputs.lang }}
      EB_PUBLISH: ${{ inputs.publish }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      GUMROAD_TOKEN: ${{ secrets.GUMROAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1 Taiyari
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core libpango-1.0-0 libpangoft2-1.0-0
          pip install google-api-python-client google-auth requests weasyprint pillow
      - name: 2 Drive se file le rahe hain
        run: python ebook.py fetch
      - name: 3 eBook likh rahe hain
        run: python ebook.py write
      - name: 4 PDF aur EPUB bana rahe hain
        run: python ebook.py pdf
      - name: 5 Cover, EPUB aur info save kar rahe hain
        run: |
          git config user.name "ebook-bot"
          git config user.email "bot@users.noreply.github.com"
          git add covers || true
          git commit -m "files ${{ inputs.lang }}" || echo "koi nayi file nahi"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
      - name: 6 Gumroad par upload
        run: python ebook.py upload
      - name: 7 PDF backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebook-pdf-${{ inputs.lang }}
          path: work/ebook.pdf
          if-no-files-found: ignore
